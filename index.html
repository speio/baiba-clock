<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Since we met</title>
  <meta name="description" content="Relativistic chronometer anchored to August 26, 2026.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Background Canvases -->
  <canvas id="farmCanvas"></canvas>
  <canvas id="trainCanvas"></canvas>

  <!-- Main User Interface -->
  <main class="app-container">
    <!-- Section 1: Since We Met -->
    <section id="sectionSinceWeMet" class="page-section">
      <header class="top-header">
        <div class="header-left">
          <span class="meta-value">2026.08.26</span>
        </div>
        <div class="header-center">
          <h1 id="clockTitle" class="title-header">SINCE WE MET</h1>
        </div>
        <div class="header-right">
          <span class="meta-value">00:00:00</span>
        </div>
      </header>

      <!-- Central Clock Section -->
      <section class="clock-display-card">
        <div class="glass-reflection"></div>
        
        <!-- Primary Display: Chronological Breakdown -->
        <div id="chronoView" class="clock-view active">
          <div class="unit-group" id="unitYears">
            <div class="digit-value" id="valYears">00</div>
            <div class="unit-label">YEARS</div>
          </div>
          <span class="unit-separator">:</span>

          <div class="unit-group" id="unitDays">
            <div class="digit-value" id="valDays">009</div>
            <div class="unit-label">DAYS</div>
          </div>
          <span class="unit-separator">:</span>

          <div class="unit-group" id="unitHours">
            <div class="digit-value" id="valHours">00</div>
            <div class="unit-label">HOURS</div>
          </div>
          <span class="unit-separator">:</span>

          <div class="unit-group" id="unitMinutes">
            <div class="digit-value" id="valMinutes">00</div>
            <div class="unit-label">MINUTES</div>
          </div>
          <span class="unit-separator">:</span>

          <div class="unit-group" id="unitSeconds">
            <div class="digit-value" id="valSeconds">00</div>
            <div class="unit-label">SECONDS</div>
          </div>
          <span class="unit-separator">.</span>

          <div class="unit-group sub-second" id="unitMillis">
            <div class="digit-value" id="valMillis">000</div>
            <div class="unit-label">MS</div>
          </div>
          <span class="unit-separator sub">.</span>

          <div class="unit-group sub-second" id="unitMicros">
            <div class="digit-value" id="valMicros">000</div>
            <div class="unit-label">µS</div>
          </div>
        </div>

        <!-- Secondary Display: Base-10 Decimal Bins -->
        <div id="binsView" class="clock-view bins-view hidden">
          <div class="bins-grid" id="binsGrid"></div>
        </div>
      </section>

      <!-- Minimal Dilation Slider Card -->
      <section class="controls-card">
        <div class="slider-header-row">
          <div class="slider-title-col">
            <div class="slider-value-badge" id="sliderValueBadge">1.0×</div>
          </div>
        </div>

        <!-- Main Slider -->
        <div class="slider-track-container">
          <div class="slider-ticks">
            <span class="tick-mark left">1.0×</span>
            <span class="tick-mark mid">2.6×</span>
            <span class="tick-mark right">7.0×</span>
          </div>
          <input 
            type="range" 
            id="distortionSlider" 
            min="0" 
            max="1" 
            step="0.001" 
            value="0" 
            class="custom-slider"
            aria-label="Dilation Slider"
          >
          <div class="slider-progress" id="sliderProgress"></div>
        </div>

        <!-- Preset Buttons (Pure Numerical Factors) -->
        <div class="presets-row">
          <button class="btn-preset active" id="btnPresetReal" data-val="0">1.0×</button>
          <button class="btn-preset" id="btnPresetWeek" data-val="0.5">2.6×</button>
          <button class="btn-preset" id="btnPresetOur" data-val="1.0">7.0×</button>
        </div>

        <!-- Minimal Action Controls -->
        <div class="actions-row">
          <div class="actions-left">
            <button class="btn-action" id="btnToggleView" title="Toggle Grid / Chrono">
              <span class="btn-icon">❖</span>
            </button>
            <button class="btn-action" id="btnPauseResume" title="Pause / Resume">
              <span class="btn-icon" id="pauseIcon">⏸</span>
            </button>
            <button class="btn-action" id="btnTimeWarpModal" title="Scrub Timeline">
              <span class="btn-icon">⏱</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Scroll Prompt to Section 2 -->
      <div class="scroll-prompt-row">
        <a href="#sectionCountdown" class="scroll-prompt-btn" aria-label="Scroll down">
          <span class="prompt-arrow">↓</span>
        </a>
      </div>
    </section>

    <!-- Section 2: Countdown & Arrival Journey -->
    <section id="sectionCountdown" class="page-section countdown-section">
      <!-- Section Header with Gondolier & Alpine Peak Icons -->
      <header class="top-header countdown-header">
        <div class="header-left waypoint-origin">
          <div class="waypoint-badge">
            <svg class="waypoint-svg" viewBox="0 0 54 36" width="46" height="30" fill="none" stroke="currentColor">
              <!-- Venetian Gondola profile with ferro (prow) -->
              <path d="M 4 24 C 12 24, 16 26, 27 26 C 38 26, 43 21, 50 14 C 47 26, 36 30, 22 30 C 10 30, 4 27, 4 24 Z" fill="rgba(15,23,42,0.08)" stroke="currentColor" stroke-width="1.3"/>
              <path d="M 50 14 L 52 7 L 48 8 L 50 14" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              <!-- Gondolier standing with oar -->
              <circle cx="18" cy="10.5" r="2.8" fill="currentColor"/>
              <path d="M 18 13.3 L 17.5 21 L 20 25" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M 13 18 L 24 13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M 12 19 L 6 32" stroke="#0284c7" stroke-width="1.3" stroke-linecap="round"/>
              <!-- Lagoon Water Ripples -->
              <path d="M 2 32 C 6 31, 9 33, 14 32 C 19 31, 23 33, 28 32 C 33 31, 37 33, 42 32" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
            <div class="waypoint-meta">
              <span class="meta-value">15:47</span>
            </div>
          </div>
        </div>

        <div class="header-center">
          <h2 class="title-header countdown-title">UNTIL ARRIVAL</h2>
        </div>

        <div class="header-right waypoint-destination">
          <div class="waypoint-badge align-right">
            <div class="waypoint-meta text-right">
              <span class="meta-value">20:36</span>
            </div>
            <svg class="waypoint-svg" viewBox="0 0 54 36" width="46" height="30" fill="none" stroke="currentColor">
              <!-- Left Peak -->
              <polygon points="6,31 18,13 30,31" fill="rgba(148,163,184,0.25)" stroke="currentColor" stroke-width="1.2"/>
              <polygon points="18,13 15,18 19,18" fill="#ffffff" stroke="#94a3b8" stroke-width="0.6"/>
              <!-- High Central Alpine Peak -->
              <polygon points="20,31 35,7 48,31" fill="rgba(100,116,139,0.3)" stroke="currentColor" stroke-width="1.4"/>
              <polygon points="35,7 29,15 35,14 41,16" fill="#ffffff" stroke="#94a3b8" stroke-width="0.6"/>
              <!-- Small front foothill -->
              <polygon points="29,31 40,19 49,31" fill="rgba(148,163,184,0.2)" stroke="currentColor" stroke-width="1"/>
              <!-- Alpine Sun Star -->
              <circle cx="43" cy="8" r="1.8" fill="#f59e0b"/>
            </svg>
          </div>
        </div>
      </header>

      <!-- Countdown Hero Display Card -->
      <section class="clock-display-card countdown-card">
        <div class="glass-reflection"></div>

        <!-- Reverse Dilated Countdown Breakdown -->
        <div id="countdownView" class="clock-view active">
          <div class="unit-group" id="countDaysGroup">
            <div class="digit-value" id="countDays">003</div>
            <div class="unit-label">DAYS</div>
          </div>
          <span class="unit-separator">:</span>

          <div class="unit-group" id="countHoursGroup">
            <div class="digit-value" id="countHours">21</div>
            <div class="unit-label">HOURS</div>
          </div>
          <span class="unit-separator">:</span>

          <div class="unit-group" id="countMinutesGroup">
            <div class="digit-value" id="countMinutes">48</div>
            <div class="unit-label">MINUTES</div>
          </div>
          <span class="unit-separator">:</span>

          <div class="unit-group" id="countSecondsGroup">
            <div class="digit-value" id="countSeconds">12</div>
            <div class="unit-label">SECONDS</div>
          </div>
          <span class="unit-separator">.</span>

          <div class="unit-group sub-second" id="countMillisGroup">
            <div class="digit-value" id="countMillis">000</div>
            <div class="unit-label">MS</div>
          </div>
          <span class="unit-separator sub">.</span>

          <div class="unit-group sub-second" id="countMicrosGroup">
            <div class="digit-value" id="countMicros">000</div>
            <div class="unit-label">µS</div>
          </div>
        </div>

        <!-- Arrival Celebration Banner (Revealed when arrival time reached) -->
        <div id="arrivalBanner" class="arrival-banner hidden">
          <div class="arrival-sparkle">✦ ✦ ✦</div>
          <h3 class="arrival-text">SHE HAS ARRIVED</h3>
        </div>
      </section>

      <!-- Scroll Back to Section 1 -->
      <div class="scroll-prompt-row back-to-top-row">
        <a href="#sectionSinceWeMet" class="scroll-prompt-btn return-btn" aria-label="Return to top">
          <span class="prompt-arrow">↑</span>
        </a>
      </div>
    </section>

    <!-- Interactive Time-Warp Scrub Modal -->
    <div id="warpModal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>SCRUB TIMELINE</h3>
          <button class="modal-close" id="btnCloseWarp">✕</button>
        </div>
        <div class="warp-presets">
          <button class="warp-chip" data-days="1">1d</button>
          <button class="warp-chip" data-days="3">3d</button>
          <button class="warp-chip" data-days="7">7d</button>
          <button class="warp-chip" data-days="9">9d</button>
          <button class="warp-chip" data-days="14">14d</button>
          <button class="warp-chip" data-days="30">30d</button>
        </div>
        <div class="warp-slider-wrap">
          <input type="range" id="warpDaysSlider" min="0.01" max="30" step="0.01" value="9.46" class="custom-slider">
          <div class="warp-val-display"><strong id="warpDaysVal">9.46</strong> d</div>
        </div>
        <div class="modal-actions">
          <button class="btn-action" id="btnResetToLive">Live</button>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
